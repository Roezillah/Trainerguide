 */const dw=[{stepNumber:1,title:"PREPARE",subtitle:"Step 4 in Restaurant Training Process",description:"The Trainer prepares themselves for training the Learner by reviewing the online course and observation guide, ensuring the right items, information, and logistics are in place, and assisting the Learner with accessing the e-learning course.",trainerTip:"Have all training materials and other Operations documents ready for use prior to the shift."},{stepNumber:2,title:"SHOW & TELL",subtitle:"Course & Trainer Guide Execution",description:"The Trainer has the Learner complete the e-learning course and prints the course Certification and Trainer Guide. The trainer demonstrates key tasks while explaining the rationale behind each step.",trainerTip:"Use of the Trainer Guide helps ensure all key points, safety standards, and positive behaviors are reinforced."},{stepNumber:3,title:"GUIDED PRACTICE",subtitle:"Step 5: Practice & Teach-Back",description:'The Trainer follows the On-The-Job (OTJ) guide with the Learner: ask questions to test understanding, have the Learner demonstrate skills, and use "Teach-Back" (Learner teaches Trainer or MIC) to verify understanding while giving positive coaching.',trainerTip:'Provide positive coaching as the learner practices, demonstrate "why and how", and always use teach-back techniques.'},{stepNumber:4,title:"FOLLOW UP",subtitle:"Observation & GM Certification",description:"The Trainer observes the Learner in applying knowledge and skills in real shifts. Use recognition cards to celebrate great performance. GM (or SL/TM Trainer) performs final certification sign-off.",trainerTip:"Allow learner to master new skills over several shifts. GM is responsible for final sign-off on Certifications."}],fw=[{week:1,dayLabel:"Day 1",courses:["Orientation","Brand Soul","Brand Champion","Washing Your Hands","Food Safety","Safety & Security"],practice:["New Hire Paperwork","Meet Team & Restaurant Tour","Orientation"],trainerGuideOTJs:["Orientation Guide","Food Safety & Washing Hands OTJ","Safety & Security OTJ"]},{week:1,dayLabel:"Day 2",courses:["Cleaning the Restaurant","Product Quality","Customer Excellence","Prep Ingredients"],practice:["Learn the Menu","Locate Cleaning System & Own Your Zone"],trainerGuideOTJs:["Cleaning the Restaurant Guide","Product Quality Guide","Customer Excellence Guide","Prep Ingredients (TG only)"]},{week:1,dayLabel:"Day 3",courses:["Equipment & Temp","Oil Management","Your Role as a Cashier","FC: Starter"],practice:["Learn the Menu","Prep & Fry Ingredients","Cleaning","Own Your Zone","Just In Time Prep"],trainerGuideOTJs:["Equipment & Temp Guide","Oil Management Guide","Prep Ingredients (TG only)","Your Role as a Cashier (TG only)","Starter Position (TG only)"]},{week:1,dayLabel:"Day 4/5",courses:["FC: Finisher","FC: Expeditor"],practice:["FC: Prep & Fry Ingredients","SC: Order Entry in POS","FC & SC: Own Your Zone"],trainerGuideOTJs:["Prep Ingredients (TG only)","FC: Starter (TG only)","FC: Finisher (TG only)","FC: Expeditor (TG only)","SC: Your Role as a Cashier (TG only)"]},{week:2,dayLabel:"Day 1",practice:["Prep & Fry Ingredients","FC: Starter Position","SC: Cashier Position","FC & SC: Tacos & Burritos","FC & SC: Own Your Zone Tasks"],trainerGuideOTJs:["Prep Ingredients OTJ","FC: Starter (TG only)","FC: Finisher (TG only)","FC: Expeditor (TG only)","SC: Your Role as a Cashier (TG only)"]},{week:2,dayLabel:"Day 2",practice:["Prep & Fry Ingredients","FC: Starter, Finisher & Expeditor Position","SC: Cashier Position","FC & SC: Quesadillas & Specialties","FC & SC: Own Your Zone Tasks"],trainerGuideOTJs:["Starter OTJ","Finisher (TG only)","Expeditor (TG only)","Cashier (TG only)"]},{week:2,dayLabel:"Day 3",practice:["Prep & Fry Ingredients","FC: Starter, Finisher & Expeditor Position","SC: Cashier Position","FC & SC: Nachos & Sides","FC & SC: Own Your Zone Tasks"],trainerGuideOTJs:["Starter OTJ","Finisher OTJ","Expeditor (TG only)","Cashier OTJ"]},{week:2,dayLabel:"Day 4/5",practice:["Prep & Fry Ingredients","FC: Starter, Finisher & Expeditor Position","SC: Cashier Position","FC & SC: All Menu Items","FC & SC: Own Your Zone Tasks"],trainerGuideOTJs:["SC: Your Role as a Cashier OTJ","FC: Starter OTJ","FC: Finisher OTJ","FC: Expeditor OTJ"]},{week:3,dayLabel:"Day 1",practice:["Prep & Fry Ingredients","FC: Starter, Finisher & Expeditor Position","SC: Cashier Position","FC & SC: Own Your Zone Tasks"],trainerGuideOTJs:["Guided Practice across all positions with Teach-Back"]},{week:3,dayLabel:"Day 2",practice:["Prep & Fry Ingredients","FC: Starter, Finisher & Expeditor Position","SC: Cashier Position","FC & SC: Own Your Zone Tasks"],trainerGuideOTJs:["Speed & Accuracy Drills","Quality Checks"]},{week:3,dayLabel:"Day 3",practice:["Prep & Fry Ingredients","FC: Starter, Finisher & Expeditor Position","SC: Cashier Position","FC & SC: Own Your Zone Tasks"],trainerGuideOTJs:["Final OTJ Evaluation Prep"]},{week:3,dayLabel:"Day 4/5",courses:["FC: Food Champion Certification","SC: Service Champion Certification"],practice:["Full Shift Independent Execution & Evaluation"],trainerGuideOTJs:["FC: Food Champion Certification Sign-off","SC: Service Champion Certification Sign-off"]}],jd=[{id:"guide-orientation",title:"Orientation, Brand Soul & Brand Champion",category:"Orientation & Culture",targetRole:"All Team Members",trainerPrep:"Use this guide to ensure you review, discuss, show and practice all elements that help your new Team Member understand Taco Bell Culture, HUNGRY principles, Live Más promise, and Uniform standards.",resources:["Orientation Course","Brand Soul & Brand Champion Courses","HUNGRY Poster & Principles Job Aid","Recognition Cards","Open Door Policy / We Care Poster","Head-to-Toe Uniform Guide & Do's & Don'ts","Social Media Policy","GDPR Poster","Career Path Poster"],beforeOTJ:['Have Team Member view the "Orientation", "Brand Soul" & "Brand Champion" e-learning courses.',"Trainer demonstrates sections A-C during training shifts before Team Member demonstrates tasks. When all behaviors on checklist are met, schedule final OTJ."],sections:[{title:"A. Team Member Expectations & Head-to-Toe Uniform Guide",items:["Representing the Brand: Explain friendly service, onstage presence, team player mindset, sense of urgency, and clean-as-you-go culture","Code of Conduct & Attendance: Be on time, ready to work; 2-hour notice for unplanned absences; speak to GM for schedule changes","Uniform Headwear: Taco Bell hat, visor, or beanie. Tie long hair back + hair net if past base of neck","Uniform Tops: Clean, wrinkle-free Taco Bell uniform shirt or manager collared shirt (tucked or untucked)","Uniform Bottoms: Solid black or dark denim jeans/pants without rips, holes, or dragging hem. Plain black belt if shirt tucked","Uniform Footwear: Solid black, closed-toe and closed-heel, slip-resistant shoes","Jewelry & Body Art: Earrings < quarter size; nose stud ok; plain wedding band without stones. NO watches/bracelets when handling food","Grooming & Cosmetics: Beards < 1/2 inch neatly trimmed (or beard net when handling food). No false eyelashes when handling food","Outerwear: Taco Bell approved sweater/jacket or solid black outerwear","Career Path: Review Career Path poster (Team Member -> Shift Lead -> Assistant Manager -> General Manager)"]},{title:"B. Brand Soul, Live Más Promise & HUNGRY Principles",items:[`Brand Soul Purpose: Explain "WE FEED PEOPLE'S LIVES WITH MÁS"`,"Live Más Promise - 1. MÁS FLAVOR: We add more flavor to life with a twist on traditional Mexican food","Live Más Promise - 2. MÁS HEART: We passionately serve each other - our guests, team members, partners, and communities","Live Más Promise - 3. MÁS VALUE: Deliver more than expected with best quality food at prices customers love",'HUNGRY Principle - H (Helpful): Serve others with an "I can do that" attitude; delight and resolve issues respectfully & compassionately',"HUNGRY Principle - U (Understanding): Strive to understand and deliver on the needs of customers, team members, and business partners","HUNGRY Principle - N (Never Settle): Aim to improve customer experience at every visit; serve safe, high-quality, craveable, affordable food","HUNGRY Principle - G (Grateful): Say thank you and mean it; appreciate what makes each person unique","HUNGRY Principle - R (Relentless): Strive to be the best at everything we do and don't let anything get in the way of doing what is right; ensure everyone feels welcome","HUNGRY Principle - Y (Youthful Spirit): Active community participation; inspired by tomorrow's leaders pursuing their dreams","Demonstrate how to recognize a Team Member using Recognition Cards","Locate & explain We Care / Open Door Policy (Speak with MIC, GM, Above Restaurant Leader, or HR Leader)","Explain Social Media Policy and show examples of appropriate vs inappropriate social media posts"]},{title:"C. Restaurant Tour",items:["Show and explain work areas for each restaurant position","Locate handwashing sink, coolers, freezers, and dry storage for chemicals/supplies","Show Own Your Zone, Deployment Chart, and Schedule board","Show Manager's office and Team Member break area","Locate chemical information binder (MSDS/SDS)","Locate alarm, panic buttons, fire extinguisher, Ansul system, and first aid kit","Show where Team Members clock in/out for shifts and breaks","Show restrooms, parking area, trash bins, and dumpsters"]}]},{id:"guide-food-safety",title:"Food Safety, Handwashing & Illness Policy",category:"Food Safety",targetRole:"All Team Members",trainerPrep:'Use this guide to ensure you review, discuss, show and practice Food Safety "BIG 6", CCP 7-step Handwashing, and Employee Illness Policy.',resources:["Food Safety and Sanitation Course","Hand Washing Course & 7-Step Job Aid",'Food Safety "BIG 6" Areas of Risk Chart',"Standards Cards","Illness Policy & Glove Policy","CORE Guide (Food Safety section)","Carryover & JIT Prep Job Aids"],beforeOTJ:['Have Team Member view "Food Safety & Sanitation" e-learning course.',"Trainer demonstrates A-B during training shifts before Team Member demonstrates tasks."],sections:[{title:'A. Food Safety "BIG 6" Areas of Risk',items:["1. Proper Cooking Temp: Rethermalizer heating to >= 74°C (165°F) for hot food safety","2. Prevent Contamination: Glove usage, handwashing, and separating raw vs cooked items","3. Proper Health & Hygiene: 20-second handwash, blue waterproof bandages, and strict illness reporting","4. Temp & Time Management: Food Danger Zone 5°C - 60°C (Global) / 5°C - 63°C (Scotland/UK), FIFO rule","5. Control Expiration Dates & Shelf-Life: Label gun M/D/H/M format, 4h JIT / 18h walk-in / 24h carryover hold times","6. Prevent Pest Entry & Activity: Keep back doors closed, trash bins sealed, and report pest activity immediately to MIC","Prep Guide & FIFO: Show Prep Guide location, calculate prep amounts, check case/packaging integrity","3-Compartment Sink: 3-step process (Wash with hot detergent, Rinse with warm water, Sanitize for min 60s soak)","Sanitizer Testing: Test sanitizer strips (Chlorine = 50-100ppm; QUAT = Min 200ppm)","Labeling & Thermometers: Create labels using Month/Day/Hours/Minutes; calibrate thermometer in ice water (0°C / 32°F)"]},{title:"B. Personal Hygiene, CCP 7-Step Handwashing & Illness Policy",items:["CCP Step 1: Wet hands with HOT water","CCP Step 2: Apply antibacterial soap and rub hands together to make a lather","CCP Step 3: Wash hands and wrists thoroughly for 20 seconds (back of hands, back of fingers, fingernails, between fingers, base of thumbs, palms, wrists)","CCP Step 4: Rinse soap off hands completely under running water","CCP Step 5: Dry hands thoroughly with a clean single-use paper towel","CCP Step 6: Use paper towel to turn off the water faucet","CCP Step 7: Apply hand sanitizer and rub together, or put on new pair of disposable gloves","Cut Protocol: Clean cut, apply blue waterproof bandage, and put on single-use glove over bandage","Glove Policy: Wash hands before putting on gloves; change gloves when changing tasks, touching non-food surfaces, or if torn","Illness Exclusion Symptoms: Must stay home if experiencing Excessive Sneezing/Coughing, Sore Throat with Fever, Vomiting/Nausea, Diarrhea, or Jaundice","BIG 5 Pathogen Reporting: Report immediately to GM/MIC if diagnosed with Norovirus, Hepatitis A, Shigella spp., E. coli (STEC), or Salmonella","Return-to-Work Rule: Must stay home for 24-48 hours AFTER vomiting or diarrhea symptoms completely cease"]}]},{id:"guide-restaurant-safety",title:"Restaurant Safety & Security",category:"Safety & Security",targetRole:"All Team Members",trainerPrep:"Ensure you review, discuss, show and practice all safety and security elements with your Team Member.",resources:["Safety & Security Course","Hazard Communication Binder","CORE Guide (Food Safety Section)"],beforeOTJ:['Have Team Member view "Safety & Security" e-learning course.',"Trainer demonstrates A-C during training shifts before Team Member demonstrates tasks."],sections:[{title:"A. General Safety",items:["Explain injury prevention and proper lifting techniques (bend at knees, back brace for >20 lb/9 kg)","Explain shelf storage rules: heavier items on lower shelves","Report injuries and hazards immediately to MIC","Check floors for liquids (water, grease) and clean immediately using mop and wet floor sign","Locate First Aid Kit, emergency phone numbers, and Hazard Communication binder",'Show chemical storage area and explain "clean as you go"']},{title:"B. Fire Safety",items:["Show clearance requirement around water heater and electrical panel: at least 3 feet (~1 m)","Explain fire emergency procedures and Ansul System activation","Explain burn prevention when working at fryer or with hot liquids (fry gloves, fry apron, tongs)","Explain PASS steps for fire extinguisher: Pull pin, Aim nozzle, Squeeze handle, Sweep nozzle"]},{title:"C. Security",items:["Explain back door policy (when and how to open safely)","Explain procedure for author
